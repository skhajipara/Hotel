<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - S.K. Hotels</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page" data-flash-message="{{ flash_message }}">

    <script src="{{ url_for('static', filename='alert.js') }}"></script>

    <div class="auth-container">
        <a href="{{ url_for('home') }}" class="auth-logo-link">
            <img src="../static/Logo.png" class="auth-logo" alt="S.K. Restaurant">
        </a>

        <div class="auth-card">
            <h2>Change Password</h2>
            <p class="auth-subtitle">Update your S.K. Hotels account password</p>

            <form action="/change-password" method="POST" id="changePasswordForm">
                
                <div class="form-group">
                    <label for="current_password"><i class="fas fa-unlock-alt"></i> Current Password</label>
                    <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required>
                </div>

                <div class="form-group" style="margin-top: 25px;">
                    <label for="new_password"><i class="fas fa-lock"></i> New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password"><i class="fas fa-check-circle"></i> Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Type new password again" required>
                    <small id="passwordError" style="color: #ff4d4d; display: none; margin-top: 5px; font-weight: 500;">
                        ❌ New passwords do not match.
                    </small>
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn-submit">Update Password</button>
                </div>
                
                <div style="margin-top: 15px; text-align: center;">
                    <a href="{{ url_for('home') }}" class="auth-link" style="color: #888;">Cancel and return to home</a>
                </div>

            </form>
        </div>
    </div>

    <script>
        // Frontend validation to check if new passwords match before submitting
        document.getElementById('changePasswordForm').addEventListener('submit', function(event) {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorText = document.getElementById('passwordError');

            if (newPassword !== confirmPassword) {
                event.preventDefault(); // Stop the form from submitting
                errorText.style.display = 'block';
                document.getElementById('confirm_password').style.borderColor = '#ff4d4d';
            } else {
                errorText.style.display = 'none';
                document.getElementById('confirm_password').style.borderColor = '#ddd';
            }
        });
    </script>
</body>
</html>
